<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子星球 · 视觉实验室</title><style>@import url("showcase-interactions.css");

rcle at 36% 30%,#f2dffb 0 2%,#b993d6 8%,#5e3b7d 35%,#191524 68%,#0e0f13 72%);box-shadow:0 0 70px rgba(167,139,195,.25),inset -30px -30px 70px rgba(0,0,0,.45);animation:float 5s ease-in-out infinite}.ring{position:absolute;width:min(46vw,520px);height:150px;border:1px solid rgba(199,170,118,.55);border-radius:50%;transform:rotate(-13deg);box-shadow:0 0 25px rgba(199,170,118,.08)}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold);animation:orbit 7s linear infinite}@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}@keyframes orbit{from{transform:rotate(0) translateX(250px) rotate(0)}to{transform:rotate(360deg) translateX(250px) rotate(-360deg)}}.note{position:absolute;bottom:4%;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(23,24,30,.86);color:var(--muted);font-size:.68rem}#player{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-rows:60px 1fr;opacity:0;visibility:hidden;transform:scale(1.02);transition:.3s}#player.open{opacity:1;visibility:visible;transform:scale(1)}.bar{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card)}.bar b{font-size:.86rem}.bar a{margin-left:auto;color:var(--violet);text-decoration:none;font-size:.72rem}iframe{width:100%;height:100%;border:0;background:#080911}@media(max-width:850px){html,body{overflow:auto}.page{height:auto;min-height:100%}.hero{grid-template-columns:1fr;padding:38px 20px}.visual{min-height:340px;order:-1}.orb{width:260px}.ring{width:320px}.dot{display:none}h1{font-size:3.6rem}.signal{display:none}}
