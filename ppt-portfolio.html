<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<meta name="theme-color" content="#030712" />
<title>孙梓睿 · PPT 作品集</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;background:#030712;font-family:"Plus Jakarta Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e2e8f0;-webkit-tap-highlight-color:transparent;}
    a{color:inherit;}

    /* ===== 背景画布（流动光影 + 星空 + 流星） ===== */
    #bg{position:fixed;inset:0;z-index:0;display:block;}
    .grid-overlay{
        position:fixed;inset:0;z-index:1;pointer-events:none;
        background-image:
            linear-gradient(rgba(125,211,252,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(125,211,252,0.05) 1px, transparent 1px);
        background-size:60px 60px;
        mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 80%);
        -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 30%, transparent 80%);
    }

    /* ===== 顶栏 ===== */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;pointer-events:none;}
    .topbar > *{pointer-events:auto;}
    .btn-back{display:inline-flex;align-items:center;gap:6px;color:#cfe8ff;text-decoration:none;padding:9px 16px;border-radius:22px;background:rgba(15,23,42,0.6);border:1px solid rgba(125,211,252,0.3);backdrop-filter:blur(10px);font-size:0.84rem;font-weight:600;transition:all .25s;cursor:pointer;}
    .btn-back:hover{border-color:#7dd3fc;background:rgba(30,41,59,0.8);transform:translateY(-1px);}
    .page-title{font-weight:800;letter-spacing:1px;font-size:0.95rem;background:linear-gradient(135deg,#67e8f9,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#7dd3fc;font-size:0.78rem;pointer-events:none;z-index:20;opacity:.75;letter-spacing:.5px;}

    /* ===== 鼠标跟随光晕（贴合页面色调，柔和） ===== */
    #cursor-glow{
        position:fixed;top:0;left:0;width:460px;height:460px;border-radius:50%;
        pointer-events:none;z-index:28;opacity:0;transform:translate3d(-50%,-50%,0);
        background:radial-gradient(circle, rgba(103,232,249,0.11) 0%, rgba(129,140,248,0.06) 42%, transparent 70%);
        transition:opacity .5s ease;will-change:transform;
    }
    @media (hover:none), (pointer:coarse){ #cursor-glow{display:none;} }

    /* ===== 视口与无限网格 ===== */
    #viewport{position:fixed;inset:0;z-index:10;overflow:hidden;touch-action:none;cursor:grab;}
    #viewport.dragging{cursor:grabbing;}
    #grid{position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform;}

    .card{
        position:absolute;border-radius:14px;overflow:hidden;
        background:rgba(15,23,42,0.72);
        border:1px solid rgba(125,211,252,0.22);
        box-shadow:0 12px 34px rgba(0,0,0,0.55);
        transition:box-shadow .25s, border-color .25s, transform .3s cubic-bezier(.4,0,.2,1);
        will-change:transform,opacity;
        user-select:none;
    }
    .card img{width:100%;height:100%;object-fit:cover;display:block;}
    .card canvas{display:block;width:100%;height:100%;object-fit:cover;}
    .card-label{
        position:absolute;left:0;right:0;bottom:0;padding:7px 11px;font-size:0.72rem;color:#e2e8f0;
        background:linear-gradient(transparent,rgba(0,0,0,0.88));
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:.3px;
    }
    .proc-cover{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:2.2rem;background:linear-gradient(135deg,#0f172a,#1e293b);color:#7dd3fc;}
    .proc-cover small{font-size:.7rem;color:#94a3b8;}
    @media (hover:hover){
        .card:hover{box-shadow:0 16px 44px rgba(79,70,229,0.55);border-color:rgba(125,211,252,0.65);z-index:5;}
    }

    /* ===== 长按拖拽聚焦模式：封面微缩 + 霓虹描边 ===== */
    body.compact .card{
        border-color:rgba(34,211,238,.6);
        box-shadow:0 10px 30px rgba(34,211,238,.28), 0 0 0 1px rgba(34,211,238,.32), 0 0 44px rgba(129,140,248,.35);
    }
    body.compact .card-label{opacity:.9;}

    /* ===== 拖拽：屏幕四周未来感霓虹灯效（夸张版） ===== */
    #neonFrame{
        position:fixed;inset:0;z-index:25;pointer-events:none;
        opacity:0;transition:opacity .3s ease;
    }
    #neonFrame.on{opacity:1;}
    #neonFrame::before{
        content:'';position:absolute;inset:0;
        box-shadow:inset 0 0 200px rgba(34,211,238,.30), inset 0 0 110px rgba(139,92,246,.24), inset 0 0 50px rgba(236,72,153,.18);
        animation:frameBreath 1.5s ease-in-out infinite;
    }
    @keyframes frameBreath{0%,100%{opacity:.75;}50%{opacity:1;}}

    .neon-edge{position:absolute;overflow:hidden;}
    .neon-edge .track{position:absolute;inset:0;filter:blur(.6px);}
    .neon-edge .core{position:absolute;z-index:1;animation:corePulse 2.6s ease-in-out infinite;}
    .neon-edge .beam{position:absolute;z-index:2;filter:blur(3px);}
    @keyframes corePulse{0%,100%{opacity:.8;}50%{opacity:1;}}

    /* ---- 上边 ---- */
    .neon-edge.t{top:0;left:0;right:0;height:60px;}
    .neon-edge.t .track{
        background:linear-gradient(180deg, rgba(34,211,238,.55), rgba(139,92,246,.34) 45%, rgba(236,72,153,.18) 70%, transparent);
        -webkit-mask-image:linear-gradient(90deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
        mask-image:linear-gradient(90deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
    }
    .neon-edge.t .core{
        left:0;right:0;top:0;height:4px;
        background:linear-gradient(90deg,transparent,#22d3ee 16%,#818cf8 40%,#e879f9 60%,#22d3ee 84%,transparent);
        box-shadow:0 0 22px rgba(34,211,238,1), 0 0 50px rgba(129,140,248,.95), 0 0 96px rgba(232,121,249,.7), 0 2px 34px rgba(34,211,238,.6);
    }
    /* ---- 下边 ---- */
    .neon-edge.b{bottom:0;left:0;right:0;height:60px;}
    .neon-edge.b .track{
        background:linear-gradient(0deg, rgba(236,72,153,.55), rgba(139,92,246,.34) 45%, rgba(34,211,238,.18) 70%, transparent);
        -webkit-mask-image:linear-gradient(90deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
        mask-image:linear-gradient(90deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
    }
    .neon-edge.b .core{
        left:0;right:0;bottom:0;height:4px;
        background:linear-gradient(90deg,transparent,#e879f9 16%,#818cf8 40%,#22d3ee 60%,#e879f9 84%,transparent);
        box-shadow:0 0 22px rgba(34,211,238,1), 0 0 50px rgba(129,140,248,.95), 0 0 96px rgba(232,121,249,.7), 0 -2px 34px rgba(34,211,238,.6);
    }
    /* ---- 右边 ---- */
    .neon-edge.r{top:0;right:0;bottom:0;width:60px;}
    .neon-edge.r .track{
        background:linear-gradient(270deg, rgba(34,211,238,.55), rgba(139,92,246,.34) 45%, rgba(236,72,153,.18) 70%, transparent);
        -webkit-mask-image:linear-gradient(180deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
        mask-image:linear-gradient(180deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
    }
    .neon-edge.r .core{
        top:0;bottom:0;right:0;width:4px;
        background:linear-gradient(180deg,transparent,#22d3ee 16%,#818cf8 40%,#e879f9 60%,#22d3ee 84%,transparent);
        box-shadow:0 0 22px rgba(34,211,238,1), 0 0 50px rgba(129,140,248,.95), 0 0 96px rgba(232,121,249,.7);
    }
    /* ---- 左边 ---- */
    .neon-edge.l{top:0;left:0;bottom:0;width:60px;}
    .neon-edge.l .track{
        background:linear-gradient(90deg, rgba(236,72,153,.55), rgba(139,92,246,.34) 45%, rgba(34,211,238,.18) 70%, transparent);
        -webkit-mask-image:linear-gradient(180deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
        mask-image:linear-gradient(180deg,transparent 2%,#000 16%,#000 84%,transparent 98%);
    }
    .neon-edge.l .core{
        top:0;bottom:0;left:0;width:4px;
        background:linear-gradient(180deg,transparent,#e879f9 16%,#818cf8 40%,#22d3ee 60%,#e879f9 84%,transparent);
        box-shadow:0 0 22px rgba(34,211,238,1), 0 0 50px rgba(129,140,248,.95), 0 0 96px rgba(232,121,249,.7);
    }

    /* 流动光柱（每边两条，交错循环） */
    .neon-edge .beam{
        top:9px;height:calc(100% - 18px);width:38%;
        background:linear-gradient(90deg,transparent,rgba(224,252,255,.95) 28%,rgba(196,181,253,.95) 55%,rgba(232,121,249,.9) 78%,transparent);
        animation:beamX 2.2s linear infinite;
    }
    .neon-edge .beam.b2{animation-delay:1.1s;opacity:.7;}
    .neon-edge.r .beam,.neon-edge.l .beam{
        top:0;left:9px;width:calc(100% - 18px);height:38%;
        background:linear-gradient(180deg,transparent,rgba(224,252,255,.95) 28%,rgba(196,181,253,.95) 55%,rgba(232,121,249,.9) 78%,transparent);
        animation:beamY 2.2s linear infinite;
    }
    .neon-edge.r .beam.b2,.neon-edge.l .beam.b2{animation-delay:1.1s;}
    @keyframes beamX{0%{transform:translateX(-110%);}100%{transform:translateX(320%);}}
    @keyframes beamY{0%{transform:translateY(-110%);}100%{transform:translateY(320%);}}

    /* 四角呼吸光点（放大版） */
    .neon-corner{position:absolute;width:26px;height:26px;border-radius:6px;
        background:linear-gradient(135deg,#67e8f9,#c084fc);
        box-shadow:0 0 26px rgba(103,232,249,1), 0 0 52px rgba(167,139,250,.85), 0 0 96px rgba(232,121,249,.6);
        animation:cornerPulse 1.3s ease-in-out infinite;}
    .neon-corner.tl{top:12px;left:12px;}
    .neon-corner.tr{top:12px;right:12px;animation-delay:.4s;}
    .neon-corner.br{bottom:12px;right:12px;animation-delay:.8s;}
    .neon-corner.bl{bottom:12px;left:12px;animation-delay:.4s;}
    @keyframes cornerPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:.8;}50%{transform:scale(1.6) rotate(45deg);opacity:1;}}

    /* ===== 详情层（帅照式 3D 翻看） ===== */
    #detail{position:fixed;inset:0;z-index:100;background:rgba(3,7,18,0.97);backdrop-filter:blur(14px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s, visibility .45s;}
    #detail.visible{opacity:1;visibility:visible;}
    .detail-bar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(125,211,252,0.15);background:rgba(7,11,26,0.6);}
    .detail-title{color:#e2e8f0;font-weight:700;flex:1;text-align:center;font-size:0.95rem;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .btn-dl{color:#fff;text-decoration:none;padding:9px 16px;border-radius:22px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);font-size:0.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;}

    .detail-stage{
        flex:1;position:relative;display:flex;align-items:center;justify-content:center;
        perspective:1400px;overflow:hidden;
    }
    .d-card{
        position:absolute;width:min(64vw,760px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;
        background:#0b1220;border:1px solid rgba(125,211,252,0.25);
        box-shadow:0 18px 48px rgba(0,0,0,0.65);
        transition:transform .55s cubic-bezier(.4,0,.2,1), opacity .55s ease, filter .55s ease;
        will-change:transform,opacity,filter;user-select:none;
    }
    .d-card img,.d-card canvas{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
    .d-card.center{transform:translateX(0) rotateY(0) scale(1);z-index:5;opacity:1;filter:brightness(1);}
    .d-card.left{transform:translateX(-46%) rotateY(28deg) scale(.78);z-index:3;opacity:.5;filter:brightness(.45);}
    .d-card.right{transform:translateX(46%) rotateY(-28deg) scale(.78);z-index:3;opacity:.5;filter:brightness(.45);}
    .d-card.far-left{transform:translateX(-78%) rotateY(40deg) scale(.62);z-index:1;opacity:.18;filter:brightness(.3);}
    .d-card.far-right{transform:translateX(78%) rotateY(-40deg) scale(.62);z-index:1;opacity:.18;filter:brightness(.3);}
    .d-card.hidden{transform:translateX(0) rotateY(0) scale(.5);z-index:0;opacity:0;filter:brightness(.3);pointer-events:none;}
    .d-nav{
        position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
        background:rgba(30,41,59,0.85);border:1px solid rgba(125,211,252,0.3);color:#e2e8f0;
        display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;z-index:20;
        backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:all .25s;
    }
    .d-nav:hover{background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;transform:translateY(-50%) scale(1.1);}
    .d-nav:active{transform:translateY(-50%) scale(.95);}
    .d-nav.prev{left:18px;}
    .d-nav.next{right:18px;}
    .d-counter{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:0.82rem;color:#cfe8ff;background:rgba(0,0,0,0.55);padding:6px 16px;border-radius:18px;backdrop-filter:blur(6px);z-index:20;letter-spacing:.5px;}
    .d-counter b{color:#67e8f9;font-weight:800;}
    .d-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7dd3fc;font-size:0.9rem;z-index:25;background:rgba(3,7,18,0.6);}

    /* ===== 自定义光标（夜间飞船，与简历站一致） ===== */
    @media (hover:hover) and (pointer:fine){
        *{cursor:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e0f2fe'/><stop offset='0.4' stop-color='%2338bdf8'/><stop offset='1' stop-color='%234f46e5'/></linearGradient><radialGradient id='f' cx='0.5' cy='0.4' r='0.6'><stop offset='0' stop-color='%23fef3c7'/><stop offset='0.4' stop-color='%23fb923c'/><stop offset='1' stop-color='%23fb923c' stop-opacity='0'/></radialGradient></defs><ellipse cx='23' cy='24' rx='6' ry='4.5' fill='url(%23f)' opacity='0.9'/><ellipse cx='22' cy='23' rx='3' ry='2' fill='%23fde68a' opacity='0.8'/><path d='M14 16 L22 20 L18 13 Z' fill='%231e40af' opacity='0.9'/><path d='M13 17 L20 22 L17 16 Z' fill='%233730a3' opacity='0.8'/><path d='M3 3 L13 8 L11 17 L6 14 Z' fill='url(%23b)' stroke='%23bae6fd' stroke-width='0.6'/><ellipse cx='8' cy='8.5' rx='2' ry='1.6' fill='%230f172a' stroke='%237dd3fc' stroke-width='0.5'/><ellipse cx='7.4' cy='7.8' rx='0.7' ry='0.5' fill='%23e0f2fe'/><circle cx='4' cy='4' r='0.9' fill='%23f0f9ff'/></svg>") 3 3, auto !important;}
        a,button,.card,.btn-back,.btn-dl,.d-nav{cursor:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e0f2fe'/><stop offset='0.4' stop-color='%2338bdf8'/><stop offset='1' stop-color='%234f46e5'/></linearGradient><radialGradient id='f' cx='0.5' cy='0.4' r='0.6'><stop offset='0' stop-color='%23fef3c7'/><stop offset='0.4' stop-color='%23fb923c'/><stop offset='1' stop-color='%23fb923c' stop-opacity='0'/></radialGradient></defs><ellipse cx='23' cy='24' rx='6' ry='4.5' fill='url(%23f)' opacity='0.9'/><ellipse cx='22' cy='23' rx='3' ry='2' fill='%23fde68a' opacity='0.8'/><path d='M14 16 L22 20 L18 13 Z' fill='%231e40af' opacity='0.9'/><path d='M13 17 L20 22 L17 16 Z' fill='%233730a3' opacity='0.8'/><path d='M3 3 L13 8 L11 17 L6 14 Z' fill='url(%23b)' stroke='%23bae6fd' stroke-width='0.6'/><ellipse cx='8' cy='8.5' rx='2' ry='1.6' fill='%230f172a' stroke='%237dd3fc' stroke-width='0.6'/><ellipse cx='7.4' cy='7.8' rx='0.7' ry='0.5' fill='%23e0f2fe'/><circle cx='4' cy='4' r='1.1' fill='%23f0f9ff'/><circle cx='4' cy='4' r='2.6' fill='none' stroke='%2367e8f9' stroke-width='0.5' opacity='0.7'/></svg>") 3 3, pointer !important;}
    }

    @media (max-width:768px){
        .page-title{font-size:0.82rem;}
        .detail-title{font-size:0.82rem;}
        .topbar{padding:10px 14px;}
        .hint{font-size:0.7rem;bottom:12px;}
        .d-card{width:78vw;}
        .d-card.left{transform:translateX(-52%) rotateY(28deg) scale(.72);}
        .d-card.right{transform:translateX(52%) rotateY(-28deg) scale(.72);}
        .d-card.far-left{transform:translateX(-86%) rotateY(40deg) scale(.55);}
        .d-card.far-right{transform:translateX(86%) rotateY(-40deg) scale(.55);}
        .d-nav{width:42px;height:42px;font-size:1.15rem;}
        .d-nav.prev{left:8px;}
        .d-nav.next{right:8px;}
    }
</style>

<body>
    <canvas id="bg"></canvas>
    <div class="grid-overlay"></div>

    <!-- ===== 鼠标跟随光晕 ===== -->
    <div id="cursor-glow" aria-hidden="true"></div>

    <header class="topbar">
        <a href="javascript:void(0)" class="btn-back" id="topBack">← 返回简历</a>
        <div class="page-title">PPT 作品集 · 孙梓睿</div>
        <span style="width:90px;"></span>
    </header>

    <div id="viewport">
        <div id="grid"></div>
    </div>

    <!-- ===== 长按拖拽：屏幕四周霓虹科技光效 ===== -->
    <div id="neonFrame" aria-hidden="true">
        <div class="neon-edge t"><span class="track"></span><span class="core"></span><i class="beam"></i><i class="beam b2"></i></div>
        <div class="neon-edge r"><span class="track"></span><span class="core"></span><i class="beam"></i><i class="beam b2"></i></div>
        <div class="neon-edge b"><span class="track"></span><span class="core"></span><i class="beam"></i><i class="beam b2"></i></div>
        <div class="neon-edge l"><span class="track"></span><span class="core"></span><i class="beam"></i><i class="beam b2"></i></div>
        <div class="neon-corner tl"></div>
        <div class="neon-corner tr"></div>
        <div class="neon-corner br"></div>
        <div class="neon-corner bl"></div>
    </div>

    <div class="hint">拖动查看（进入霓虹聚焦） · 点击任意 PPT 翻页欣赏</div>

    <div id="detail">
        <div class="detail-bar">
            <a href="javascript:void(0)" class="btn-back" id="detailBack">← 返回作品集</a>
            <div class="detail-title" id="detailTitle"></div>
            <a class="btn-dl" id="downloadBtn" download>⬇ 下载原文件</a>
        </div>
        <div class="detail-stage" id="detailStage">
            <div class="d-nav prev" id="dPrev">‹</div>
            <div class="d-nav next" id="dNext">›</div>
            <div class="d-counter"><b id="dCur">1</b> / <span id="dTotal">1</span></div>
            <div class="d-loading" id="dLoading" style="display:none;">渲染中…</div>
        </div>
    </div>

    <script src="ppt-previews/manifest.js"></script>
    <script>
    (function(){
        "use strict";
        const MANIFEST = window.PPT_MANIFEST || [];
        const inIframe = (window.self !== window.top);

        // 每个作品的幻灯片：全部由本地 PNG 提供
        const ITEMS = MANIFEST.map(function(m, i){
            const slides = [];
            for(let s=1;s<=m.slides;s++){ slides.push(encodeURI('ppt-previews/'+m.folder+'/幻灯片'+s+'.PNG')); }
            return { idx:i, title:m.title, cover:slides[0], slides:slides, manifest:m };
        });

        /* ============ 背景动画：流动光斑 + 星空 + 流星 ============ */
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
        function resize(){
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * DPR; canvas.height = H * DPR;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(DPR,0,0,DPR,0,0);
        }
        resize();
        window.addEventListener('resize', resize);

        const stars = [];
        for(let i=0;i<170;i++){
            stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+0.2, a:Math.random(), tw:Math.random()*0.04+0.01, dir:Math.random()<0.5?1:-1 });
        }
        const blobs = [
            { x:0.22, y:0.30, c:'rgba(79,70,229,0.28)',  sx:0.0006, sy:0.0005, ph:0   },
            { x:0.80, y:0.72, c:'rgba(14,165,233,0.24)', sx:0.0005, sy:0.0007, ph:2.1 },
            { x:0.52, y:0.50, c:'rgba(168,85,247,0.18)', sx:0.0008, sy:0.0006, ph:4.3 }
        ];
        const meteors = [];
        function spawnMeteor(){
            meteors.push({ x: Math.random()*W*0.9, y: -30, vx: 3+Math.random()*3.5, vy: 4+Math.random()*4, len: 90+Math.random()*120 });
        }
        setInterval(function(){ if(meteors.length < 5 && Math.random() < 0.75) spawnMeteor(); }, 1300);

        let t = 0;
        function frame(){
            t += 1;
            const g = ctx.createLinearGradient(0,0,W,H);
            g.addColorStop(0,'#05070f'); g.addColorStop(0.5,'#070b1a'); g.addColorStop(1,'#030712');
            ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
            blobs.forEach(function(b){
                const cx = (b.x + Math.sin(t*b.sx + b.ph)*0.14) * W;
                const cy = (b.y + Math.cos(t*b.sy + b.ph)*0.12) * H;
                const R = Math.max(W,H) * 0.48;
                const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
                rg.addColorStop(0,b.c); rg.addColorStop(1,'rgba(0,0,0,0)');
                ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
            });
            stars.forEach(function(s){
                s.a += s.tw * s.dir;
                if(s.a > 1){ s.a = 1; s.dir = -1; }
                if(s.a < 0.15){ s.a = 0.15; s.dir = 1; }
                ctx.globalAlpha = s.a; ctx.fillStyle = '#cfe8ff';
                ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
            for(let i=meteors.length-1;i>=0;i--){
                const m = meteors[i];
                m.x += m.vx; m.y += m.vy;
                const tx = m.x - m.vx * m.len / 7, ty = m.y - m.vy * m.len / 7;
                const grad = ctx.createLinearGradient(m.x,m.y,tx,ty);
                grad.addColorStop(0,'rgba(255,255,255,0.95)');
                grad.addColorStop(0.3,'rgba(165,243,252,0.6)');
                grad.addColorStop(1,'rgba(125,211,252,0)');
                ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(m.x,m.y,1.9,0,Math.PI*2); ctx.fill();
                if(m.x > W+120 || m.y > H+120) meteors.splice(i,1);
            }
            requestAnimationFrame(frame);
        }
        frame();

        /* ============ 无限拖动网格（均匀交错排列） ============ */
        const grid = document.getElementById('grid');
        const viewport = document.getElementById('viewport');
        const isMobile = window.innerWidth < 768;
        const CARD_W = isMobile ? 178 : 320;
        const CARD_H = isMobile ? 116 : 208;
        const GAP    = isMobile ? 26 : 52;
        const COLS = isMobile ? 2 : 3;
        let ROWS = Math.max(2, Math.ceil(ITEMS.length / COLS));
        if(ROWS % 2 === 1) ROWS += 1;          // 偶数行：交错图案垂直方向无缝循环
        const TILES = 5;

        // 交错（砖墙式）：奇数行整体右移半个间距；各方向间距均匀
        let compact = false;                     // 拖拽聚焦模式
        function dims(){
            const spx = CARD_W + GAP, spy = CARD_H + GAP;
            return { cw: CARD_W, ch: CARD_H, spx: spx, spy: spy, tileW: COLS*spx, tileH: ROWS*spy };
        }
        const TILE_W = dims().tileW, TILE_H = dims().tileH;

        const allCards = [];
        function buildCardContent(card, item){
            if(item.cover){
                card.innerHTML = '<img src="'+item.cover+'" alt="'+item.title+'" loading="lazy"><div class="card-label">'+item.title+'</div>';
            }else{
                card.innerHTML = '<div class="proc-cover">📄<small>'+(item.manifest.type==='pdf'?'PDF':'加载中')+'</small></div><div class="card-label">'+item.title+'</div>';
            }
        }
        function layoutSlot(slot){
            const p = slot.split(',');
            const ty = +p[0], tx = +p[1], r = +p[2], c = +p[3];
            const d = dims();
            const stagger = (r % 2 === 1) ? d.spx / 2 : 0;
            return { left: tx*d.tileW + c*d.spx + stagger, top: ty*d.tileH + r*d.spy };
        }
        for(let ty=0; ty<TILES; ty++){
            for(let tx=0; tx<TILES; tx++){
                for(let r=0; r<ROWS; r++){
                    for(let c=0; c<COLS; c++){
                        const idx = (r*COLS + c) % ITEMS.length;
                        const item = ITEMS[idx];
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.dataset.idx = idx;
                        card.dataset.slot = ty + ',' + tx + ',' + r + ',' + c;
                        const pos = layoutSlot(card.dataset.slot);
                        const d = dims();
                        card.style.left = pos.left + 'px';
                        card.style.top  = pos.top + 'px';
                        card.style.width = d.cw + 'px';
                        card.style.height = d.ch + 'px';
                        buildCardContent(card, item);
                        grid.appendChild(card);
                        allCards.push(card);
                    }
                }
            }
        }
        grid.style.width = (TILES*TILE_W) + 'px';
        grid.style.height = (TILES*TILE_H) + 'px';

        // 预计算聚焦模式 transform（向网格中心收缩 + 缩小），纯 GPU 合成，拖拽不卡顿
        const GRID_CX = (TILES*TILE_W)/2, GRID_CY = (TILES*TILE_H)/2;
        allCards.forEach(function(card){
            const cx = parseFloat(card.style.left) + CARD_W/2;
            const cy = parseFloat(card.style.top) + CARD_H/2;
            card.dataset.tx = (-(cx - GRID_CX) * 0.12).toFixed(1);
            card.dataset.ty = (-(cy - GRID_CY) * 0.12).toFixed(1);
        });

        let ox = 0, oy = 0;
        function applyTransform(){ grid.style.transform = 'translate(calc(-50% + '+ox+'px), calc(-50% + '+oy+'px))'; }
        function wrap(){
            const d = dims();
            while(ox >  d.tileW) ox -= d.tileW;
            while(ox < -d.tileW) ox += d.tileW;
            while(oy >  d.tileH) oy -= d.tileH;
            while(oy < -d.tileH) oy += d.tileH;
        }
        ox = -(TILE_W*0.3); oy = -(TILE_H*0.25);
        applyTransform();

        // 拖拽聚焦模式：封面微缩 + 密度加大 + 屏幕四周霓虹（transform 合成，流畅）
        function activateCompact(){
            compact = true;
            document.body.classList.add('compact');
            const nf = document.getElementById('neonFrame');
            if(nf) nf.classList.add('on');
            allCards.forEach(function(card){
                card.style.transform = 'translate('+card.dataset.tx+'px,'+card.dataset.ty+'px) scale(0.9)';
            });
        }
        function deactivateCompact(){
            compact = false;
            document.body.classList.remove('compact');
            const nf = document.getElementById('neonFrame');
            if(nf) nf.classList.remove('on');
            allCards.forEach(function(card){ card.style.transform = ''; });
        }

        // 拖动：一开始移动就进入霓虹聚焦模式
        let dragging = false, moved = false, sx=0, sy=0, sox=0, soy=0, suppressClick = false;
        function onDown(e){
            if(detailOpen) return;
            dragging = true; moved = false;
            sx = e.clientX; sy = e.clientY; sox = ox; soy = oy;
            viewport.classList.add('dragging'); grid.style.transition = 'none';
        }
        function onMove(e){
            if(!dragging) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if(!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
                moved = true;
                activateCompact();
            }
            ox = sox + dx; oy = soy + dy; wrap(); applyTransform();
        }
        function onUp(){
            if(!dragging) return;
            dragging = false; viewport.classList.remove('dragging');
            if(compact) deactivateCompact();
            if(moved){ suppressClick = true; setTimeout(function(){ suppressClick = false; }, 150); }
        }
        viewport.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);

        allCards.forEach(function(card){
            card.addEventListener('click', function(){
                if(dragging || suppressClick || detailOpen) return;
                openDetail(parseInt(card.dataset.idx, 10), card);
            });
        });

        /* ============ 详情层：帅照式 3D 翻看 ============ */
        const detail = document.getElementById('detail');
        const detailTitle = document.getElementById('detailTitle');
        const detailStage = document.getElementById('detailStage');
        const dPrev = document.getElementById('dPrev');
        const dNext = document.getElementById('dNext');
        const dCur = document.getElementById('dCur');
        const dTotal = document.getElementById('dTotal');
        const dLoading = document.getElementById('dLoading');
        const downloadBtn = document.getElementById('downloadBtn');
        const detailBack = document.getElementById('detailBack');
        let detailOpen = false, currentItem = null, currentSlide = 0, dCards = [];

        function openDetail(idx, clicked){
            detailOpen = true;
            // 其他卡片散开消失
            allCards.forEach(function(card){
                if(card === clicked) return;
                const rx = (Math.random()-0.5) * 2600, ry = (Math.random()-0.5) * 2600, rot = (Math.random()-0.5) * 140;
                card.style.transition = 'transform .8s cubic-bezier(.5,.05,.3,1), opacity .8s ease';
                card.style.transform = 'translate('+rx+'px,'+ry+'px) rotate('+rot+'deg) scale(0.15)';
                card.style.opacity = '0';
            });
            // 被点击卡片移到中心放大后淡出
            const rect = clicked.getBoundingClientRect();
            const dx = window.innerWidth/2 - (rect.left + rect.width/2);
            const dy = window.innerHeight/2 - (rect.top + rect.height/2);
            clicked.style.transition = 'transform .55s cubic-bezier(.2,.75,.2,1), opacity .35s .45s ease';
            clicked.style.transform = 'translate('+dx+'px,'+dy+'px) scale(1.9)';
            clicked.style.zIndex = '60';
            setTimeout(function(){ clicked.style.opacity = '0'; }, 500);

            setTimeout(function(){ showDetail(idx); }, 660);
        }

        function showDetail(idx){
            const item = ITEMS[idx];
            currentItem = item;
            currentSlide = 0;
            detailTitle.textContent = item.title;
            // 清旧卡片
            dCards.forEach(function(c){ c.remove(); });
            dCards = [];

            const slides = item.slides || [];
            dTotal.textContent = slides.length;
            downloadBtn.href = encodeURI('ppt/'+item.manifest.file);
            downloadBtn.setAttribute('download', item.manifest.file);
            // 构建 5 张卡片（center/left/right/far-left/far-right），内容随 currentSlide 更新
            for(let i=0;i<5;i++){
                const c = document.createElement('div');
                c.className = 'd-card';
                detailStage.appendChild(c);
                dCards.push(c);
            }
            updateDetailCards();
            detail.classList.add('visible');
        }

        function setCardImage(card, slideIdx){
            const item = currentItem;
            const slides = item.slides || [];
            if(slides[slideIdx]){
                card.innerHTML = '<img src="'+slides[slideIdx]+'" alt="幻灯片 '+(slideIdx+1)+'">';
            }else{
                card.innerHTML = '';
            }
        }

        function updateDetailCards(){
            if(!currentItem) return;
            const total = (currentItem.slides || []).length;
            if(total === 0) return;
            // dCards 顺序：[far-left, left, center, right, far-right]
            const positions = ['far-left','left','center','right','far-right'];
            const offsets = [-2,-1,0,1,2];
            dCards.forEach(function(card, i){
                const si = (currentSlide + offsets[i] + total) % total;
                setCardImage(card, si);
                card.className = 'd-card ' + positions[i];
            });
            dCur.textContent = (currentSlide + 1);
        }

        function nextSlide(){
            if(!currentItem) return;
            const total = (currentItem.slides || []).length;
            if(total === 0) return;
            currentSlide = (currentSlide + 1) % total;
            updateDetailCards();
        }
        function prevSlide(){
            if(!currentItem) return;
            const total = (currentItem.slides || []).length;
            if(total === 0) return;
            currentSlide = (currentSlide - 1 + total) % total;
            updateDetailCards();
        }
        dNext.addEventListener('click', nextSlide);
        dPrev.addEventListener('click', prevSlide);

        // 详情层左右滑动翻页（移动端）
        let dSX=0, dSY=0, dMoved=false;
        detailStage.addEventListener('pointerdown', function(e){
            dSX = e.clientX; dSY = e.clientY; dMoved = false;
        });
        detailStage.addEventListener('pointermove', function(e){
            if(dSX === 0) return;
            const dx = e.clientX - dSX, dy = e.clientY - dSY;
            if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) dMoved = true;
        });
        detailStage.addEventListener('pointerup', function(e){
            const dx = e.clientX - dSX;
            if(dMoved && Math.abs(dx) > 50){
                if(dx < 0) nextSlide(); else prevSlide();
            }
            dSX = 0; dMoved = false;
        });

        function closeDetail(){
            detail.classList.remove('visible');
            setTimeout(function(){
                detailOpen = false; currentItem = null;
                dCards.forEach(function(c){ c.remove(); }); dCards = [];
                // 重新汇聚所有卡片
                allCards.forEach(function(card){
                    card.style.transition = 'transform .75s cubic-bezier(.2,.75,.2,1), opacity .6s ease';
                    card.style.transform = ''; card.style.opacity = '1'; card.style.zIndex = '';
                });
                setTimeout(function(){ allCards.forEach(function(c){ c.style.transition = ''; }); }, 820);
            }, 420);
        }
        detailBack.addEventListener('click', closeDetail);

        // 键盘翻页 / ESC
        window.addEventListener('keydown', function(e){
            if(!detailOpen) return;
            if(e.key === 'Escape'){ closeDetail(); }
            else if(e.key === 'ArrowRight'){ nextSlide(); }
            else if(e.key === 'ArrowLeft'){ prevSlide(); }
        });

        /* ============ 返回简历：iframe 内通知父级关闭 overlay；独立访问则跳转 ============ */
        function backToResume(){
            if(inIframe){
                window.parent.postMessage('close-ppt-portfolio', '*');
            }else{
                window.location.href = 'index.html#ai-ppt';
            }
        }
        document.getElementById('topBack').addEventListener('click', backToResume);

        document.addEventListener('dragstart', function(e){ e.preventDefault(); });

        /* ============ 鼠标跟随光晕 ============ */
        (function(){
            const glow = document.getElementById('cursor-glow');
            if(!glow || window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
            let tx=-9999, ty=-9999, cx=-9999, cy=-9999;
            window.addEventListener('mousemove', function(e){ tx=e.clientX; ty=e.clientY; });
            document.addEventListener('mouseleave', function(){ tx=-9999; ty=-9999; glow.style.opacity='0'; });
            (function follow(){
                if(Math.abs(tx-cx) > 900 || Math.abs(ty-cy) > 900){ cx=tx; cy=ty; }
                cx += (tx-cx)*0.12; cy += (ty-cy)*0.12;
                if(tx > -9000) glow.style.opacity = '1';
                glow.style.transform = 'translate3d('+cx+'px,'+cy+'px,0) translate(-50%,-50%)';
                requestAnimationFrame(follow);
            })();
        })();
    })();
    </script>
<script src="page-interactions.js"></script>
