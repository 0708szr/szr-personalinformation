<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Strike · 飞行任务中心</title><style>@import url("showcase-interactions.css");
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0c1015;--card:#141a21;--line:#28323d;--text:#eef1f3;--muted:#9ca7b1;--blue:#77a5c8;--gold:#c7aa76}html,body{width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text)}button,a{font:inherit}.page{height:100%;display:grid;grid-template-rows:68px 1fr;background:linear-gradient(165deg,rgba(69,102,131,.13),transparent 45%),var(--bg)}header{display:flex;align-items:center;gap:15px;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line)}.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}.brand{font-size:.85rem;font-weight:700}.brand span{color:var(--blue)}.clock{margin-left:auto;color:var(--muted);font-size:.7rem;letter-spacing:.12em}.mission{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,.8fr);gap:clamp(35px,7vw,100px);align-items:center;padding:clamp(36px,7vw,90px)}.eyebrow{color:var(--blue);font-size:.7rem;letter-spacing:.2em;margin-bottom:17px}h1{font-size:clamp(3.4rem,8vw,7.3rem);line-height:.86;letter-spacing:-.08em;font-weight:640}h1 span{display:block;color:var(--blue)}.lead{margin-top:28px;max-width:650px;color:var(--muted);line-height:1.85;font-size:.93rem}.actions{display:flex;gap:11px;margin-top:30px}.primary,.secondary{padding:12px 18px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer}.primary{border:1px solid var(--blue);background:var(--blue);color:#0c1117}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text)}.radar{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 54px,rgba(119,165,200,.12) 55px 56px),linear-gradient(rgba(119,165,200,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(119,165,200,.08) 1px,transparent 1px),var(--card);background-size:auto,50% 50%,50% 50%,auto;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}.radar:before{content:"";position:absolute;inset:50% 0 0 50%;transform-origin:0 0;background:conic-gradient(from -24deg,rgba(119,165,200,.38),transparent 48deg);animation:sweep 4s linear infinite}.plane{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:4.8rem;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}.blip{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px var(--gold)}.b1{left:28%;top:34%}.b2{right:22%;bottom:27%}.b3{right:30%;top:20%}@keyframes sweep{to{transform:rotate(360deg)}}.missiondata{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.data{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center}.data b{display:block;color:var(--blue);font-size:1.1rem}.data small{color:var(--muted);font-size:.64rem}#player{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-rows:60px 1fr;opacity:0;visibility:hidden;transform:scale(1.02);transition:.3s}#player.open{opacity:1;visibility:visible;transform:scale(1)}.bar{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card)}.bar b{font-size:.86rem}.bar a{margin-left:auto;color:var(--blue);text-decoration:none;font-size:.72rem}iframe{width:100%;height:100%;border:0;background:#080b10}@media(max-width:850px){html,body{overflow:auto}.page{height:auto;min-height:100%}.mission{grid-template-columns:1fr;padding:38px 20px}.radar{width:290px;margin:auto;order:-1}.plane{font-size:3.5rem}h1{font-size:4rem}.clock{display:none}}
</style></head><body><div class="page"><header><button class="round" onclick="back()">←</button><div class="brand">孙梓睿<span>.</span> 飞行任务中心</div><div class="clock">SECTOR 07 · ALL SYSTEMS NOMINAL</div></header><main class="mission"><section><div class="eyebrow">GAME 03 / ARCADE FLIGHT</div><h1>SKY<span>STRIKE</span></h1><p class="lead">驾驶战机穿过敌机编队，在高速射击、炸弹清屏和 BOSS 战中争取更高分数。支持键盘、鼠标拖动和手机触控。</p><div class="missiondata"><div class="data"><b>∞</b><small>无尽模式</small></div><div class="data"><b>BOSS</b><small>阶段战斗</small></div><div class="data"><b>3</b><small>操作方式</small></div></div><div class="actions"><button class="primary" onclick="launch()">开始飞行 →</button><button class="secondary" onclick="location.href='game-portfolio.html?v=20260825'">返回作品集</button></div></section><aside class="radar"><div class="plane">✈️</div><i class="blip b1"></i><i class="blip b2"></i><i class="blip b3"></i></aside></main></div><section id="player"><div class="bar"><button class="round" onclick="closePlayer()">←</button><b>Sky Strike · 星空歼灭战</b><a href="飞机游戏/index.html?v=20260825" target="_blank">新窗口打开 ↗</a></div><iframe id="frame" title="飞机大战"></iframe></section><script>const player=document.getElementById('player'),frame=document.getElementById('frame');function launch(){frame.src='飞机游戏/index.html?v=20260825';player.classList.add('open')}function closePlayer(){player.classList.remove('open');frame.src='about:blank'}function back(){if(player.classList.contains('open'))return closePlayer();if(self!==top)parent.postMessage('close-game-portfolio','*');else location.href='index.html#games'}addEventListener('keydown',e=>{if(e.key==='Escape')back()});</script></body></html>
